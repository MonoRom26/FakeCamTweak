name: Build Rootless Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: beerpiss/theos-action@v1

      - name: Fix Line Endings (CRLF to LF)
        run: |
          tr -d '\r' < control > control.tmp && mv control.tmp control
          tr -d '\r' < Makefile > Makefile.tmp && mv Makefile.tmp Makefile

      - name: Build .deb Package
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FakeCamTweak-Rootless-Deb
          path: packages/*.deb
