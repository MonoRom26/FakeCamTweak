name: Build Rootless Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com $THEOS
          
          # Download patched iOS SDKs for Theos
          curl -LO https://github.com
          unzip master.zip
          mv sdks-master/*.sdk $THEOS/sdks/
          rm -rf sdks-master master.zip

      - name: Build .deb Package
        run: |
          export THEOS=~/theos
          make clean package FINALPACKAGE=1

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FakeCamTweak-Rootless-Deb
          path: packages/*.deb
